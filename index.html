<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Planet Hub</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #334155;
        }
        h1 { color: #38bdf8; margin: 0; font-size: 1.5rem; }
        .wallet-btn {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 10px 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .chart-container {
            height: 450px;
            margin-top: 25px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <h1>Crypto Planet 🚀</h1>
        <button class="wallet-btn" onclick="connectWallet()">Connect Wallet</button>
    </header>

    <!-- TradingView Live Interactive Chart -->
    <div class="chart-container">
        <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_chart&symbol=BINANCE%3ABTCUSDT&interval=D&hidesidetoolbar=1&symboledit=1&saveimage=1&toolbarbg=f1f3f6&studies=[]&theme=dark&style=1&timezone=Etc%2FUTC" width="100%" height="100%" frameborder="0" allowtransparency="true" scrolling="no"></iframe>
    </div>

    <script>
        async function connectWallet() {
            // Checks for injected Web3 provider (Phantom, OKX, Trust Wallet)
            if (window.solana && window.solana.isPhantom) {
                try {
                    const resp = await window.solana.connect();
                    const pubKey = resp.publicKey.toString();
                    alert("Wallet Connected: " + pubKey.substring(0, 4) + "..." + pubKey.substring(pubKey.length - 4));
                } catch (err) {
                    alert("User rejected connection request.");
                }
            } else if (window.ethereum) {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    const account = accounts[0];
                    alert("Wallet Connected: " + account.substring(0, 4) + "..." + account.substring(account.length - 4));
                } catch (err) {
                    alert("User rejected connection request.");
                }
            } else {
                alert("No Web3 wallet detected! Please install Phantom, OKX, or Trust Wallet extension.");
            }
        }
    </script>
</body>
</html>
